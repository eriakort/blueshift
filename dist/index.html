<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>BlueShift — SOC Analyst Range</title>
<meta name="description" content="BlueShift: a fully simulated SOC analyst training range. Triage SIEM alerts, map them to MITRE ATT&CK, and grade your dispositions against ground truth. Offline, deterministic, no backend."/>
<style>:root {
  --bg: #0b1220; --panel: #121c2e; --panel-2: #0f1828; --raise: #18273d; --line: #233551;
  --ink: #e8eef7; --muted: #8aa0bd; --accent: #4aa8ff; --accent-2: #38e0c0; --good: #44d492; --warn: #e5c15c;
  --critical: #ff5a6a; --high: #ff9d5c; --medium: #e5c15c; --low: #7fb0ff;
  --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
#app, .bs-shell { height: 100%; }
.bs-shell { display: grid; grid-template-columns: 236px 1fr; }

/* rail */
.bs-rail { background: linear-gradient(180deg, var(--panel), var(--panel-2)); border-right: 1px solid var(--line); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; overflow: auto; }
.bs-brand { display: flex; gap: 10px; align-items: center; padding: 4px 6px 14px; }
.bs-logo { font-size: 20px; color: var(--accent); letter-spacing: -2px; }
.bs-brand strong { display: block; font-size: 16px; letter-spacing: .3px; }
.bs-brand small { color: var(--muted); font-size: 11px; }
.bs-rail-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 8px 6px 4px; }
.bs-mod { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 1px solid transparent; color: var(--ink); border-radius: 10px; padding: 9px 10px; cursor: pointer; }
.bs-mod:hover:not(:disabled) { background: var(--raise); }
.bs-mod.active { background: var(--raise); border-color: color-mix(in srgb, var(--accent) 45%, transparent); box-shadow: inset 2px 0 var(--accent); }
.bs-mod.soon { opacity: .5; cursor: default; }
.bs-mod-glyph { font-size: 15px; color: var(--accent); width: 20px; text-align: center; }
.bs-mod-text b { display: block; font-size: 13px; }
.bs-mod-text small { color: var(--muted); font-size: 11px; }
.bs-soon { margin-left: auto; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 2px 6px; }
.bs-rail-foot { margin-top: auto; color: var(--muted); font-size: 11px; padding: 10px 6px; border-top: 1px solid var(--line); }

/* main */
.bs-main { overflow: auto; padding: 22px 26px; }
.bs-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.bs-eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.bs-top h1 { font-size: 24px; margin: 3px 0 0; }
.bs-top-actions { display: flex; gap: 12px; align-items: center; }
.bs-score { border: 1px solid var(--line); border-radius: 10px; padding: 7px 14px; text-align: center; background: var(--panel); }
.bs-score span { display: block; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.bs-score strong { font-size: 20px; color: var(--accent-2); }
.bs-score small { display: block; color: var(--muted); font-size: 11px; }
.bs-btn { background: var(--raise); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 8px 13px; cursor: pointer; font-size: 13px; }
.bs-btn:hover { border-color: var(--accent); }
.bs-btn.ghost { background: transparent; }
.bs-link { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }

.bs-kpis { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1.4fr; gap: 10px; margin: 16px 0; }
.bs-kpi { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 12px 15px; }
.bs-kpi span { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.bs-kpi strong { display: block; font-size: 26px; line-height: 1.1; }
.bs-kpi em { font-size: 11px; color: var(--muted); font-style: normal; }
.bs-kpi.k-critical strong { color: var(--critical); } .bs-kpi.k-high strong { color: var(--high); } .bs-kpi.k-medium strong { color: var(--medium); }

.bs-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.bs-toolbar label { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.bs-toolbar select, .bs-toolbar input { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; }
.bs-toolbar input { flex: 1; min-width: 200px; }
.bs-count { font-size: 12px; color: var(--muted); margin-left: auto; }

.bs-split { display: grid; grid-template-columns: minmax(320px, 1.1fr) 1.5fr; gap: 14px; align-items: start; }
.bs-queue { display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 290px); overflow: auto; }
.bs-row { display: flex; gap: 11px; align-items: center; text-align: left; width: 100%; background: var(--panel); border: 1px solid var(--line); border-left-width: 3px; border-radius: 10px; padding: 11px 12px; cursor: pointer; color: var(--ink); }
.bs-row:hover { background: var(--raise); }
.bs-row.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.bs-row.closed { opacity: .6; }
.bs-row.sev-critical { border-left-color: var(--critical); } .bs-row.sev-high { border-left-color: var(--high); } .bs-row.sev-medium { border-left-color: var(--medium); } .bs-row.sev-low { border-left-color: var(--low); }
.bs-sev { flex: none; width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-size: 11px; color: #0b1220; }
.bs-sev.sev-critical { background: var(--critical); } .bs-sev.sev-high { background: var(--high); } .bs-sev.sev-medium { background: var(--medium); } .bs-sev.sev-low { background: var(--low); }
.bs-row-main { flex: 1; min-width: 0; }
.bs-row-main b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bs-row-main small { color: var(--muted); font-size: 11px; }
.bs-row-state { flex: none; font-size: 13px; }
.bs-row-state.ok { color: var(--good); } .bs-row-state.bad { color: var(--critical); } .bs-row-state.wip { color: var(--accent); }

.bs-detail { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 16px 18px; min-height: 200px; }
.bs-detail-head { display: flex; gap: 12px; align-items: flex-start; }
.bs-sev-badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; padding: 4px 9px; border-radius: 6px; color: #0b1220; white-space: nowrap; }
.bs-sev-badge.sev-critical { background: var(--critical); } .bs-sev-badge.sev-high { background: var(--high); } .bs-sev-badge.sev-medium { background: var(--medium); } .bs-sev-badge.sev-low { background: var(--low); }
.bs-detail-head h2 { font-size: 17px; margin: 0 0 6px; }
.bs-detail-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bs-chip { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; border: 1px solid var(--line); border-radius: 12px; padding: 2px 9px; }
.bs-chip.ghost { color: var(--muted); }
.bs-mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.bs-asset-card { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; padding: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; }
.bs-asset-card span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.bs-asset-card b { font-size: 13px; }
.crit-critical { color: var(--critical); } .crit-high { color: var(--high); } .crit-medium { color: var(--medium); } .crit-low { color: var(--low); }
.bs-section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 7px; }
.bs-log { background: #070d18; border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px; font-family: var(--mono); font-size: 12px; color: #bcd3f0; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-height: 220px; overflow: auto; }
.bs-reco { margin: 14px 0; padding: 11px 13px; background: var(--raise); border-left: 3px solid var(--accent); border-radius: 0 9px 9px 0; }
.bs-reco b { font-size: 12px; } .bs-reco p { margin: 5px 0 0; font-size: 13px; color: var(--ink); }
.bs-feedback { margin: 14px 0; padding: 11px 13px; border-radius: 9px; font-size: 13px; }
.bs-feedback.good { background: color-mix(in srgb, var(--good) 15%, transparent); border: 1px solid color-mix(in srgb, var(--good) 45%, transparent); }
.bs-feedback.bad { background: color-mix(in srgb, var(--critical) 13%, transparent); border: 1px solid color-mix(in srgb, var(--critical) 40%, transparent); }
.bs-dispo { display: flex; gap: 8px; flex-wrap: wrap; }
.bs-btn.dispo { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.bs-inv { color: var(--accent); font-size: 13px; align-self: center; }
.bs-closed-note { font-size: 13px; color: var(--muted); }
.bs-empty { border: 1px dashed var(--line); border-radius: 10px; padding: 26px; text-align: center; color: var(--muted); }

@media (max-width: 1000px) { .bs-shell { grid-template-columns: 1fr; } .bs-rail { flex-direction: row; overflow-x: auto; align-items: center; } .bs-rail-label, .bs-rail-foot { display: none; } .bs-split { grid-template-columns: 1fr; } .bs-kpis { grid-template-columns: 1fr 1fr; } .bs-asset-card { grid-template-columns: 1fr 1fr; } }

/* sub-tabs */
.bs-subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 16px; }
.bs-subtab { background: none; border: none; color: var(--muted); padding: 9px 14px; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.bs-subtab:hover { color: var(--ink); }
.bs-subtab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* SPL search */
.bs-spl-bar { display: flex; gap: 10px; align-items: stretch; }
.bs-spl-prompt { display: flex; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--accent-2); background: var(--panel-2); border: 1px solid var(--line); border-right: none; border-radius: 9px 0 0 9px; padding: 0 12px; letter-spacing: .05em; }
#bsSpl { flex: 1; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-left: none; border-radius: 0; padding: 11px 12px; font-family: var(--mono); font-size: 13px; resize: vertical; line-height: 1.5; }
#bsSpl:focus { outline: none; border-color: var(--accent); }
.bs-btn.primary { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; border-radius: 0 9px 9px 0; white-space: nowrap; }
.bs-spl-meta { display: flex; justify-content: space-between; align-items: center; margin: 8px 2px; font-size: 12px; color: var(--muted); }
.bs-examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.bs-ex { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 11px; cursor: pointer; }
.bs-ex:hover { border-color: var(--accent); color: var(--ink); }
.bs-cheat { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 6px 14px; margin-bottom: 14px; }
.bs-cheat-row { display: grid; grid-template-columns: 170px 1fr; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.bs-cheat-row:last-child { border-bottom: none; }
.bs-cheat-row > code { font-family: var(--mono); font-size: 12px; color: var(--accent-2); }
.bs-cheat-row b { font-family: var(--mono); font-size: 12px; color: var(--ink); display: block; }
.bs-cheat-row small { color: var(--muted); font-size: 12px; }
.bs-spl-error { border: 1px solid color-mix(in srgb, var(--critical) 45%, transparent); background: color-mix(in srgb, var(--critical) 12%, transparent); color: #ffd4d9; border-radius: 9px; padding: 12px 14px; font-family: var(--mono); font-size: 13px; }
.bs-result-head { display: flex; gap: 10px; align-items: center; margin: 6px 2px 8px; font-size: 12px; color: var(--muted); }
.bs-badge { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 3px 8px; border-radius: 6px; }
.bs-badge.ev { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent); }
.bs-badge.tbl { background: color-mix(in srgb, var(--accent-2) 20%, transparent); color: var(--accent-2); }
.bs-table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; max-height: calc(100vh - 360px); }
.bs-table { border-collapse: collapse; width: 100%; font-size: 12px; }
.bs-table th { position: sticky; top: 0; background: var(--panel-2); text-align: left; padding: 9px 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--mono); }
.bs-table td { padding: 8px 12px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); font-family: var(--mono); white-space: nowrap; color: #cfe0f5; }
.bs-table td.num { text-align: right; color: var(--accent-2); }
.bs-table tbody tr:hover { background: var(--raise); }
</style>

  const r = STATE.search.result, n = STATE.env.events.length;
  return `
    <div class="bs-spl">
      <div class="bs-spl-bar">
        <span class="bs-spl-prompt">SPL</span>
        <textarea id="bsSpl" rows="2" spellcheck="false" placeholder="index=auth action=failure | stats count by user | sort -count">${esc(STATE.search.query)}</textarea>
        <button class="bs-btn primary" id="bsSplRun" title="Run (Ctrl/⌘+Enter)">▸ Search</button>
      </div>
      <div class="bs-spl-meta">
        <span>${n} events indexed this shift</span>
        <button class="bs-link" id="bsCheatToggle">${STATE.cheat ? 'Hide' : 'Show'} SPL reference</button>
      </div>
      <div class="bs-examples">${EXAMPLES.map(q => `<button class="bs-ex" data-ex="${esc(q)}">${esc(q.length > 58 ? q.slice(0, 56) + '…' : q)}</button>`).join('')}</div>
      ${STATE.cheat ? `<div class="bs-cheat">${CHEAT.map(([cmd, ex, desc]) => `<div class="bs-cheat-row"><code>${esc(cmd)}</code><div><b>${esc(ex)}</b><small>${esc(desc)}</small></div></div>`).join('')}</div>` : ''}
      <div class="bs-results">${resultView(r)}</div>
    </div>`;
}

function resultView(r) {
  if (!r) return '<div class="bs-empty">Run a search to see events and statistics from this shift’s index.</div>';
  if (!r.ok) return `<div class="bs-spl-error">✗ ${esc(r.error)}</div>`;
  if (!r.rows.length) return '<div class="bs-empty">No results. Broaden the search or check field names.</div>';
  const cols = r.columns.filter(c => r.rows.some(row => row[c] !== undefined));
  const head = cols.map(c => `<th>${esc(c)}</th>`).join('');
  const body = r.rows.slice(0, 200).map(row => `<tr>${cols.map(c => `<td${/^(count|percent|bytes|total|mean)$/.test(c) || typeof row[c] === 'number' ? ' class="num"' : ''}>${esc(row[c] == null ? '' : row[c])}</td>`).join('')}</tr>`).join('');
  return `<div class="bs-result-head"><span class="bs-badge ${r.type === 'events' ? 'ev' : 'tbl'}">${r.type === 'events' ? 'events' : 'statistics'}</span><span>${r.rows.length} result${r.rows.length === 1 ? '' : 's'}${r.rows.length > 200 ? ' (showing 200)' : ''}</span></div>
    <div class="bs-table-wrap"><table class="bs-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

function queueRow(a, sel) {
  const stateDot = a.status === 'closed' ? (a.analystVerdict === a.truth ? 'ok' : 'bad') : a.status === 'investigating' ? 'wip' : '';
  return `<button class="bs-row sev-${a.severity}${sel && a.id === sel.id ? ' selected' : ''}${a.status === 'closed' ? ' closed' : ''}" data-alert="${a.id}">
    <span class="bs-sev sev-${a.severity}">${a.severity[0].toUpperCase()}</span>
    <span class="bs-row-main"><b>${esc(a.title)}</b><small>${esc(a.asset.hostname)} · ${esc(a.category)} · ${esc(a.techniqueId)} · ${a.minutesAgo}m ago</small></span>
    ${stateDot ? `<span class="bs-row-state ${stateDot}" title="${a.status}">${stateDot === 'ok' ? '✓' : stateDot === 'bad' ? '✗' : '●'}</span>` : ''}
  </button>`;
}

function detail(a) {
  const closed = a.status === 'closed';
  const fb = STATE.feedback && STATE.feedback.id === a.id ? STATE.feedback : null;
  return `
    <div class="bs-detail-head">
      <span class="bs-sev-badge sev-${a.severity}">${a.severity.toUpperCase()}</span>
      <div><h2>${esc(a.title)}</h2><div class="bs-detail-meta"><span class="bs-chip">${esc(a.category)}</span><span class="bs-chip ghost">ATT&CK · ${esc(a.techniqueId)} ${esc(a.technique)}</span><span class="bs-mono">${esc(a.id)}</span></div></div>
    </div>
    <div class="bs-asset-card">
      <div><span>Asset</span><b>${esc(a.asset.hostname)}</b></div>
      <div><span>Address</span><b class="bs-mono">${esc(a.asset.ip)}</b></div>
      <div><span>Role</span><b>${esc(a.asset.role)}</b></div>
      <div><span>Criticality</span><b class="crit-${a.asset.criticality}">${esc(a.asset.criticality)}</b></div>
      <div><span>Owner</span><b>${esc(a.asset.owner)}</b></div>
      <div><span>Detection</span><b>${esc(a.rule)}</b></div>
    </div>
    <div class="bs-section-label">Raw events</div>
    <pre class="bs-log">${a.events.map(e => esc(e)).join('\n')}</pre>
    <div class="bs-reco"><b>Recommended response</b><p>${esc(a.recommendation)}</p></div>
    ${fb ? `<div class="bs-feedback ${fb.correct ? 'good' : 'bad'}">${fb.correct ? '✓ Correct' : '✗ Not quite'} — this alert was <b>${esc(VERDICT_LABEL[fb.truth])}</b>. You called it <b>${esc(VERDICT_LABEL[fb.verdict])}</b>.</div>` : ''}
    <div class="bs-section-label">Disposition</div>
    ${closed
      ? `<div class="bs-closed-note">Closed as <b>${esc(VERDICT_LABEL[a.analystVerdict])}</b>. <button class="bs-link" data-reopen="${a.id}">Reopen</button></div>`
      : `<div class="bs-dispo">${DISPOSITIONS.map(d => `<button class="bs-btn dispo" data-dispo="${d.key}" data-alert="${a.id}" title="${esc(d.hint)}">${esc(d.label)}</button>`).join('')}${a.status !== 'investigating' ? `<button class="bs-btn ghost" data-ack="${a.id}">Start investigating</button>` : '<span class="bs-inv">● investigating</span>'}</div>`}
  `;
}

function wire() {
  $('#bsNewShift').addEventListener('click', () => newShift());
  document.querySelectorAll('.bs-subtab').forEach(b => b.addEventListener('click', () => { STATE.view = b.dataset.view; render(); }));
  if (STATE.view === 'search') { wireSearch(); return; }
  $('#bsSev').addEventListener('change', e => { STATE.filters.severity = e.target.value; render(); });
  $('#bsStatus').addEventListener('change', e => { STATE.filters.status = e.target.value; render(); });
  const search = $('#bsSearch');
  search.addEventListener('input', e => { STATE.filters.query = e.target.value; render(); const n = $('#bsSearch'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
  document.querySelectorAll('[data-alert]').forEach(b => b.addEventListener('click', e => {
    if (e.target.closest('[data-dispo],[data-ack],[data-reopen]')) return;
    STATE.selected = b.dataset.alert; STATE.feedback = null; render();
  }));
  document.querySelectorAll('[data-ack]').forEach(b => b.addEventListener('click', () => { Model.acknowledgeAlert(STATE.env, b.dataset.ack); render(); }));
  document.querySelectorAll('[data-reopen]').forEach(b => b.addEventListener('click', () => { Model.reopenAlert(STATE.env, b.dataset.reopen); STATE.feedback = null; render(); }));
  document.querySelectorAll('[data-dispo]').forEach(b => b.addEventListener('click', () => {
    const r = Model.triageAlert(STATE.env, b.dataset.alert, b.dataset.dispo);
    if (r.ok) STATE.feedback = { id: b.dataset.alert, correct: r.correct, truth: r.truth, verdict: b.dataset.dispo };
    render();
  }));
}

function wireSearch() {
  const ta = $('#bsSpl');
  ta.addEventListener('input', e => { STATE.search.query = e.target.value; });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runSearch(); } });
  $('#bsSplRun').addEventListener('click', () => { STATE.search.query = ta.value; runSearch(); });
  $('#bsCheatToggle').addEventListener('click', () => { STATE.cheat = !STATE.cheat; render(); });
  document.querySelectorAll('[data-ex]').forEach(b => b.addEventListener('click', () => { STATE.search.query = b.dataset.ex; runSearch(); }));
}

function boot() { newShift(1); }
if (typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', boot);
module.exports = { boot, STATE, newShift };

});
require('./ui');
</script></body>
</html>
